<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          var storedFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return storedFetch || realFetch;
            },
            set: function(newFetch) {
              storedFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already non-configurable
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منظومة ShadiFlex للمحاسبة والفوترة الإلكترونية (محاكاة ZATCA)</title>
    <meta name="description" content="برنامج محاسبي سعودي متكامل للمبيعات ونقاط البيع وإدارة الحسابات مع فاحص ومحاكي اشتراطات الفوترة الإلكترونية (ZATCA)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace !important;
      }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-800 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
